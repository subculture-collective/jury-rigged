services:
    db:
        image: postgres:16-alpine
        container_name: juryrigged-db
        restart: unless-stopped
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_now}
            POSTGRES_DB: juryrigged
        ports:
            - '127.0.0.1:55432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres -d juryrigged']
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - internal

    api:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: juryrigged-api
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy
        env_file:
            - .env
        environment:
            PORT: 3001
            TRUST_PROXY: ${TRUST_PROXY:-1}
            DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-change_this_now}@db:5432/juryrigged
        ports:
            - '${API_BIND_ADDR:-127.0.0.1}:${API_HOST_PORT:-3001}:3001'
        volumes:
            - twitch_runtime:/app/.runtime
        networks:
            - internal
            - web
            - monitoring

volumes:
    postgres_data:
    twitch_runtime:

networks:
    internal:
    web:
        driver: bridge

    monitoring:
        name: monitoring
        external: true
